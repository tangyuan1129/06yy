<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            max-height: 800px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }
        .message {
            margin-bottom: 16px;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: #e2e8f0;
            color: #1e293b;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .chat-input-container {
            padding: 20px;
            background: #fff;
            border-top: 1px solid #e2e8f0;
        }
        .chat-input-wrapper {
            display: flex;
            gap: 12px;
        }
        #chatInput {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
        }
        #chatInput:focus { border-color: #667eea; }
        .btn {
            padding: 14px 28px;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        .error-message { background: #fee2e2 !important; color: #b91c1c !important; }
    </style>
</head>
<body>
<div id="app">
    <div class="chat-container">
        <div class="chat-header">AI Chat Assistant</div>
        <div class="chat-window" ref="chatWindow">
            <div v-for="(msg, index) in messages" :key="index"
                 :class="['message', msg.role === 'user' ? 'user-message' : 'bot-message']">
                {{ msg.content }}
            </div>
        </div>
        <div class="chat-input-container">
            <form @submit.prevent="sendMessage" class="chat-input-wrapper">
                <input id="chatInput"
                       v-model="userInput"
                       :disabled="isGenerating"
                       placeholder="请输入消息..."
                       autocomplete="off">
                <button v-if="!isGenerating" type="submit" class="btn btn-primary">发送</button>
                <button v-else type="button" class="btn btn-danger" @click="stopGeneration">停止</button>
            </form>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, nextTick } = Vue;

    createApp({
        setup() {
            const messages = ref([]);
            const userInput = ref('');
            const isGenerating = ref(false);
            const chatWindow = ref(null);
            let abortController = null;

            const scrollToBottom = async () => {
                await nextTick();
                if (chatWindow.value) {
                    chatWindow.value.scrollTop = chatWindow.value.scrollHeight;
                }
            };

            const sendMessage = async () => {
                if (!userInput.value.trim() || isGenerating.value) return;

                const message = userInput.value.trim();
                messages.value.push({ role: 'user', content: message });
                userInput.value = '';
                isGenerating.value = true;
                await scrollToBottom();

                const assistantIndex = messages.value.length;
                messages.value.push({ role: 'assistant', content: '' });

                abortController = new AbortController();

                try {
                    console.log('发送消息:', message);
                    const response = await fetch('/api/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message }),
                        signal: abortController.signal
                    });

                    if (!response.ok) throw new Error('HTTP错误: ' + response.status);

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        console.log('收到数据:', buffer);

                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            if (line.startsWith('data:')) {
                                const data = line.substring(5).trim();
                                if (data === '[DONE]') continue;

                                if (data) {
                                    messages.value[assistantIndex].content += data;
                                    await scrollToBottom();
                                }
                            }
                        }
                    }
                } catch (err) {
                    if (err.name === 'AbortError') {
                        console.log('用户停止生成');
                    } else {
                        console.error('错误:', err);
                        messages.value[assistantIndex].content = '[错误: ' + err.message + ']';
                    }
                } finally {
                    isGenerating.value = false;
                    abortController = null;
                }
            };

            const stopGeneration = () => {
                if (abortController) {
                    abortController.abort();
                }
            };

            return {
                messages,
                userInput,
                isGenerating,
                chatWindow,
                sendMessage,
                stopGeneration
            };
        }
    }).mount('#app');
</script>
</body>
</html>
