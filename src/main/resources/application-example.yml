server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/aichat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 大模型API配置 - 智谱AI
llm:
  provider: zhipu
  api:
    key: 你的智谱AI API Key
    url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-4
  temperature: 0.7
  max_tokens: 1000

logging:
  level:
    com.aichat: DEBUG
    org.springframework.web.reactive.function.client: DEBUG