server:
  port: 8080
  address: 0.0.0.0
  ssl:
    enabled: true
    key-store: classpath:aichat.p12
    key-store-password: aichat2024
    key-store-type: PKCS12
    key-alias: aichat
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  http2:
    enabled: true

spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/aichat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  web:
    resources:
      charset: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 大模型API配置 - 智谱AI
llm:
  provider: zhipu
  api:
    key: ${ZHIPU_API_KEY:}
    url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-4
  temperature: 0.7
  max_tokens: 1000

logging:
  level:
    com.aichat: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

# 群聊升级配置
groupchat:
  # 发言门控配置
  gate:
    history-count: 10
    max-replies-in-window: 2
    time-window-minutes: 5
    model: glm-4-flash
  
  # Life Tick配置
  life-tick:
    min-interval-minutes: 20
    max-interval-minutes: 120
    model: glm-4
    recent-message-count: 20
  
  # 主动消息配置
  active-message:
    daily-max-count: 3
    quiet-start-hour: 1
    quiet-end-hour: 7
  
  # 模型路由配置
  model-route:
    cheap-model: glm-4-flash
    medium-model: glm-4-plus
    expensive-model: glm-4